<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Captura con marca de agua</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 16px;
      background: #f5f5f5;
      text-align: center;
    }

    .container {
      max-width: 520px;
      margin: auto;
      background: white;
      padding: 16px;
      border-radius: 12px;
      box-shadow: 0 2px 10px rgba(0,0,0,.12);
    }

    video, canvas, img {
      width: 100%;
      border-radius: 12px;
      background: #000;
    }

    button {
      margin: 8px 4px;
      padding: 12px 16px;
      border: none;
      border-radius: 10px;
      background: #0b57d0;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #preview {
      display: none;
      margin-top: 12px;
    }

    #status {
      margin-top: 12px;
      font-size: 14px;
      color: #333;
      word-break: break-word;
      text-align: left;
      white-space: pre-line;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Capturar foto</h2>

    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas" style="display:none;"></canvas>
    <img id="preview" alt="Vista previa" />

    <div>
      <button id="btnCam">Abrir cámara</button>
      <button id="btnFoto">Tomar foto</button>
      <button id="btnEnviar">Enviar a Apps Script</button>
    </div>

    <div id="status"></div>
  </div>

  <script>
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzxlpC8xvBlVGNOJ41m1dRWu48NxBVMWb3M-bsaB67kC-UMVvUC1yjMXXpXNVDb6IL9/exec';

    let stream = null;
    let capturedBase64 = null;
    let cameraReady = false;

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const preview = document.getElementById('preview');
    const btnCam = document.getElementById('btnCam');
    const btnFoto = document.getElementById('btnFoto');
    const btnEnviar = document.getElementById('btnEnviar');

    btnCam.addEventListener('click', startCamera);
    btnFoto.addEventListener('click', takePhoto);
    btnEnviar.addEventListener('click', uploadPhoto);

    async function startCamera() {
      try {
        cameraReady = false;
        capturedBase64 = null;
        preview.style.display = 'none';

        if (stream) {
          stream.getTracks().forEach(track => track.stop());
        }

        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: 'environment' },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        });

        video.srcObject = stream;

        await video.play();

        if (video.readyState >= 2 && video.videoWidth > 0 && video.videoHeight > 0) {
          cameraReady = true;
          setStatus('Cámara activa y lista para capturar');
          return;
        }

        video.onloadedmetadata = async () => {
          await video.play();
          setTimeout(() => {
            if (video.videoWidth > 0 && video.videoHeight > 0) {
              cameraReady = true;
              setStatus('Cámara activa y lista para capturar');
            } else {
              setStatus('La cámara abrió, pero aún no entrega imagen. Espera un momento.');
            }
          }, 300);
        };

      } catch (e) {
        setStatus('No se pudo abrir la cámara: ' + e.name + ' - ' + e.message);
      }
    }

    function takePhoto() {
      if (!cameraReady) {
        setStatus('La cámara aún no está lista. Abre la cámara y espera 1 segundo.');
        return;
      }

      if (!video.videoWidth || !video.videoHeight) {
        setStatus('No hay dimensiones válidas del video para capturar.');
        return;
      }

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;

      const ctx = canvas.getContext('2d');

      setStatus('Capturando foto...');

      setTimeout(() => {
        try {
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

          const fecha = new Date().toLocaleString('es-CO');

          const fontSize = Math.max(24, Math.floor(canvas.width * 0.035));
          ctx.font = `bold ${fontSize}px Arial`;
          ctx.fillStyle = 'rgba(255, 0, 0, 0.28)';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';

          ctx.translate(canvas.width / 2, canvas.height / 2);
          ctx.rotate(-Math.PI / 8);
          ctx.fillText('Documento capturado', 0, -10);
          ctx.fillText(fecha, 0, fontSize + 10);
          ctx.setTransform(1, 0, 0, 1, 0, 0);

          capturedBase64 = canvas.toDataURL('image/jpeg', 0.92);

          if (!capturedBase64 || capturedBase64 === 'data:,') {
            setStatus('No se pudo generar la imagen capturada.');
            return;
          }

          preview.src = capturedBase64;
          preview.style.display = 'block';

          setStatus('Foto capturada con marca de agua correctamente');
        } catch (err) {
          setStatus('Error al capturar la foto: ' + err.message);
        }
      }, 200);
    }

    async function uploadPhoto() {
      if (!capturedBase64) {
        setStatus('Primero toma una foto');
        return;
      }

      setStatus('Enviando imagen a Apps Script...');

      try {
        const res = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          mode: 'cors',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            imageBase64: capturedBase64
          })
        });

        const text = await res.text();

        let data;
        try {
          data = JSON.parse(text);
        } catch (e) {
          setStatus('La respuesta no vino en JSON. Respuesta: ' + text);
          return;
        }

        if (!data.ok) {
          setStatus('Error desde Apps Script: ' + (data.error || 'desconocido'));
          return;
        }

        let msg = 'Guardado correcto en Drive\n';
        msg += 'Imagen: ' + data.imageUrl + '\n';
        msg += 'PDF: ' + data.pdfUrl + '\n';
        setStatus(msg);

      } catch (err) {
        setStatus('Error de red o CORS: ' + err.message);
      }
    }

    function setStatus(msg) {
      document.getElementById('status').innerText = msg;
      console.log(msg);
    }
  </script>
</body>
</html>
